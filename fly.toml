# Fly.io config for a single-user private app.
#
# Rename `app` to whatever `fly launch` gives you (it must be globally unique).
# syd = Sydney, the closest region to Melbourne — keep the Turso database in the same
# region or every query pays a round trip across the country.

app = "personal-dashboard"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret config only. Everything sensitive goes in `fly secrets set` — see
  # docs/deploy.md.
  NODE_ENV = "production"

  # NO GOOGLE_REDIRECT_URI. It was here, naming a fly.dev host, and it was never in effect:
  # THE LIVE DEPLOYMENT IS VERCEL, which does not read this file. The app now derives the
  # OAuth callback from the incoming request (callbackUrl() in src/lib/google.ts), so it is
  # correct on Fly, on Vercel and on localhost without anyone maintaining a hostname in
  # three places. Do not add it back.

[http_service]
  internal_port = 3000
  force_https = true

  # One user, used a few times a day. Letting the machine sleep when idle is the
  # difference between a few dollars a month and a few tens of dollars. The cost is a
  # cold start (~2-5s) on the first request after idling.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # NOTE: exactly one machine. This app keeps brute-force lockout state and the libSQL
  # client in process memory, and the coach's manual tool loop is not designed to be
  # load-balanced mid-turn. Do not scale this out without revisiting both.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  # The coach turn is I/O-bound (waiting on Anthropic), not CPU-bound. 512MB is
  # comfortable for Next 16 + the libsql native module; 256MB is not.
  size = "shared-cpu-1x"
  memory = "512mb"

# No [mounts]. The database lives on Turso — a volume here would tempt a file: URL
# back into production, which is exactly the failure the guard in client.ts prevents.
